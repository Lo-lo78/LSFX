name: Build LSFX VST3 Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      experimental_sf2_multigroup:
        description: 'SF2 separate outputs and channel compressors; uncheck for stereo recovery'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Create log directory
        run: New-Item -ItemType Directory -Force logs | Out-Null
      - name: Validate FluidSynth patch installer
        shell: pwsh
        run: |
          python Tests/FluidNotePatchTest.py 2>&1 | Tee-Object -FilePath logs/fluid-note-patch-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install FluidSynth
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { throw 'VCPKG_INSTALLATION_ROOT is not set on the runner' }
          $overlay = Join-Path $PWD.Path 'build-vcpkg-overlay'
          python Tools/PrepareFluidSynthOverlay.py "$root" "$overlay" 2>&1 | Tee-Object -FilePath logs/fluid-overlay.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/vcpkg.exe" install 'fluidsynth[sndfile]:x64-windows-static-md' --classic "--overlay-ports=$overlay" 2>&1 | Tee-Object -FilePath logs/vcpkg.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_MODE=OFF "-DLSFX_EXPERIMENTAL_SF2_MULTIGROUP=${{ (github.event_name != 'workflow_dispatch' || inputs.experimental_sf2_multigroup) && 'ON' || 'OFF' }}" 2>&1 | Tee-Object -FilePath logs/configure.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native FluidSynth smoke test
        shell: pwsh
        run: |
          cmake --build build --config Release --target LSFXFluidSmoke LSFXFluidNoteRoutingSmoke LSFXNoteRouteGroupsTest LSFXGridNavigationTest LSFXFluidMapSmoke LSFXVirtualProgramMapTest LSFXChannelCompressorTest LSFXSoundFontExportTest LSFXSfzSoundFontExportTest LSFXInstrumentProjectTest --parallel 2 2>&1 | Tee-Object -FilePath logs/fluid-smoke-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test keyboard navigation
        shell: pwsh
        run: |
          & ./build/Release/LSFXGridNavigationTest.exe 2>&1 | Tee-Object -FilePath logs/grid-navigation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test instrument editor model
        shell: pwsh
        run: |
          & ./build/Release/LSFXInstrumentProjectTest.exe build/editor-model-fixtures 2>&1 | Tee-Object -FilePath logs/instrument-editor-model.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test channel compressor DSP
        shell: pwsh
        run: |
          & ./build/Release/LSFXChannelCompressorTest.exe 2>&1 | Tee-Object -FilePath logs/channel-compressor-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SF2 stereo recovery
        timeout-minutes: 2
        shell: pwsh
        run: |
          python Tests/MakeSmokeSoundFont.py build/smoke.sf2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/LSFXFluidSmoke.exe build/smoke.sf2 stereo 2>&1 | Tee-Object -FilePath logs/fluid-stereo-smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test virtual map and multiple SF2 sources in stereo
        timeout-minutes: 2
        shell: pwsh
        run: |
          Copy-Item build/smoke.sf2 build/smoke-second.sf2
          & ./build/Release/LSFXVirtualProgramMapTest.exe 2>&1 | Tee-Object -FilePath logs/virtual-map-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/LSFXFluidMapSmoke.exe build/smoke.sf2 build/smoke-second.sf2 2>&1 | Tee-Object -FilePath logs/fluid-map-smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test selective SoundFont export and reload
        timeout-minutes: 2
        shell: pwsh
        run: |
          & ./build/Release/LSFXSoundFontExportTest.exe build/smoke.sf2 build/smoke-second.sf2 build/exported.sf2 2>&1 | Tee-Object -FilePath logs/sf2-export-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/LSFXFluidSmoke.exe build/exported.sf2 stereo 2>&1 | Tee-Object -FilePath logs/sf2-export-reload.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SFZ conversion and mixed SoundFont reload
        timeout-minutes: 2
        shell: pwsh
        run: |
          & ./build/Release/LSFXSfzSoundFontExportTest.exe build/sfz-export-fixtures build/smoke.sf2 build/sfz-mixed-export.sf2 2>&1 | Tee-Object -FilePath logs/sfz-export-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/LSFXFluidSmoke.exe build/sfz-mixed-export.sf2 stereo 2>&1 | Tee-Object -FilePath logs/sfz-export-reload.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose experimental SF2 multigroup in a separate process
        timeout-minutes: 2
        shell: pwsh
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && !inputs.experimental_sf2_multigroup }}
        run: |
          & ./build/Release/LSFXFluidSmoke.exe build/smoke.sf2 multi 2>&1 | Tee-Object -FilePath logs/fluid-multi-smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SF2 per-note groups and dry sends before VST3
        timeout-minutes: 2
        shell: pwsh
        run: |
          & ./build/Release/LSFXNoteRouteGroupsTest.exe 2>&1 | Tee-Object -FilePath logs/note-group-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/LSFXFluidNoteRoutingSmoke.exe build/smoke.sf2 2>&1 | Tee-Object -FilePath logs/fluid-note-routing.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target LSFX_VST3 --parallel 2 2>&1 | Tee-Object -FilePath logs/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the hybrid LSFX processor outside REAPER
        timeout-minutes: 20
        shell: pwsh
        run: |
          cmake --build build --config Release --target LSFXHybridSmoke --parallel 2 2>&1 | Tee-Object -FilePath logs/hybrid-smoke-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tests/MakeSmokeSFZ.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/LSFXHybridSmoke_artefacts/Release/LSFXHybridSmoke.exe build/smoke.sf2 build/sfz-one.sfz build/sfz-two.sfz 2>&1 | Tee-Object -FilePath logs/hybrid-smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package 0.99.3-TEST34
        shell: pwsh
        run: |
          Start-Transcript -Path logs/package.txt -Force | Out-Null
          try {
            $bundle = 'build/LSFX_artefacts/Release/VST3/LSFX.vst3'
            if (-not (Test-Path $bundle)) { throw "Missing VST3: $bundle" }
            New-Item -ItemType Directory -Force package,package/ThirdParty,package/Doc | Out-Null
            Copy-Item -Recurse $bundle package/
            Copy-Item README.md,THIRD_PARTY.md,TESTING.md,LICENSE.md package/
            Copy-Item Doc/LSFX-Guide-EN.html,Doc/LSFX-Guida-IT.html,Doc/DEVELOPMENT_HISTORY.md,Doc/LJuno-116-LICENSE.md package/Doc/
            Copy-Item Tools/fluidsynth-vla-size.patch,Tools/fluidsynth-note-routing.patch,Tools/ApplyFluidNoteRouting.py,Tools/GenerateFluidNoteRoutingCmake.py,Tools/PrepareFluidSynthOverlay.py package/ThirdParty/
            Copy-Item Doc/LJuno-116-LICENSE.md package/ThirdParty/LJuno-116-LICENSE.md
            Copy-Item build/_deps/juce-src/LICENSE.md package/ThirdParty/JUCE-LICENSE.md
            Copy-Item build/_deps/sfizz-src/LICENSE package/ThirdParty/sfizz-LICENSE.txt
            $root = $env:VCPKG_INSTALLATION_ROOT
            Get-ChildItem "$root/installed/x64-windows-static-md/share" -Directory | ForEach-Object {
              $lic = Join-Path $_.FullName 'copyright'
              if (Test-Path $lic) { Copy-Item $lic "package/ThirdParty/$($_.Name)-copyright.txt" }
            }
            & "$root/vcpkg.exe" list | Out-File -Encoding utf8 package/ThirdParty/vcpkg-versions.txt
            git -C $root rev-parse HEAD | Out-File -Encoding utf8 package/ThirdParty/vcpkg-commit.txt
            git rev-parse HEAD | Out-File -Encoding utf8 package/source-commit.txt
            Compress-Archive -Path package/* -DestinationPath LSFX.0.99.3-TEST34${{ (github.event_name == 'workflow_dispatch' && !inputs.experimental_sf2_multigroup) && '-SF2-stereo' || '' }}.Windows.x64.VST3.zip -Force
          } catch {
            $_ | Out-String | Add-Content -Path logs/package-error.txt
            throw
          } finally {
            Stop-Transcript | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LSFX-0.99.3-TEST34${{ (github.event_name == 'workflow_dispatch' && !inputs.experimental_sf2_multigroup) && '-SF2-stereo' || '' }}-Windows-x64
          path: LSFX.0.99.3-TEST34${{ (github.event_name == 'workflow_dispatch' && !inputs.experimental_sf2_multigroup) && '-SF2-stereo' || '' }}.Windows.x64.VST3.zip
          if-no-files-found: error
      - name: Upload build logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LSFX-0.99.3-TEST34-build-logs
          path: logs/*.txt
          if-no-files-found: warn
